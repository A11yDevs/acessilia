# Coleta as métricas de request da API (contagem, status HTTP, latência), expostas
# em /metrics quando ENABLE_METRICS=true. Sem essa variável o alvo fica fora do ar e
# o Prometheus apenas registra o target como down.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: acessilia-api
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      # Nome do serviço no docker-compose; resolve pela rede interna do compose.
      - targets: ["acessilia:8000"]
        labels:
          service: acessilia

  # Métricas do console de observabilidade, incluindo runs diretos do Agno.
  - job_name: acessilia-observability
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["observability-frontend:8010"]
        labels:
          service: observability

  # CPU, memória e disco da máquina que roda os containers.
  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
