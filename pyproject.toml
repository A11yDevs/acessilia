[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acessilia"
version = "0.2.0"
description = "Extração, classificação e conversão de documentos (PDF, DOCX, imagens) em formatos acessíveis com LLMs, servidas por API REST, painel web, bot do Telegram e CLI."
authors = [{name = "Jhonata"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "loguru>=0.7.3,<0.8",
    "aiosmtplib>=5.1.2,<6",
    "edge-tts>=7.3.1,<8",
    "fastapi>=0.162,<0.163",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<0.31",
    "aiogram>=3.13,<4",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1.0,<2",
    "slowapi>=0.1.10,<0.2",
    "python-multipart>=0.0.32,<0.1",
    "jinja2>=3.1.6,<4",
    "agno==3.0.5",
    "jsonschema>=4.20,<5",
    "openai>=2.45.0,<3",
    "ollama>=0.6.2,<0.7",
    "sqlalchemy>=2.0.51,<3",
    "babel>=2.18.0,<3",
    # Character similarity of the two providers' pages in dual fusion, on the
    # scale of the VLM judge's gate (docstruct's pure-Python ratio takes ~2 s a
    # page). Also docstruct's text_ed accelerator for `scripts.bench score`.
    "rapidfuzz>=3.9,<4",
    # Núcleo puro de processamento estrutural (libs/docstruct, instalado editável)
    "acessilia-docstruct",
    # Acesso às capacidades da Toolbox pelo contrato HTTP (libs/sdk, instalado editável)
    "acessilia-sdk",
    # The core's PDDL pipeline (libs/core, installed editable; ADR-0016)
    "acessilia-core",
]

[project.urls]
Homepage = "https://github.com/A11yDevs/acessilia"
Repository = "https://github.com/A11yDevs/acessilia"
Issues = "https://github.com/A11yDevs/acessilia/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=6.0,<8",
    "respx>=0.23.1,<0.24",
    "pytest-asyncio>=1.4.0,<2",
    # Builds the page images the Toolbox end-to-end tests send.
    "pillow>=13,<14",
    # Builds and renders test PDFs (tests/toolbox_render_fake.py and fixtures);
    # the application renders and extracts only on the Toolbox.
    "pymupdf>=1.24,<2",
    "pytest-timeout>=2.4,<3",
    # Runs the core suite in parallel; the isolation fixes are in #448.
    "pytest-xdist>=3.8,<4",
    # Static analysis and formatting checks (#366). 0.17 made I001 ignore
    # trailing pragma comments for line length, which the isort policy relies on.
    "ruff>=0.17,<1",
    "mypy>=1.15,<2",
    # Stubs for the async file helpers the service uses.
    "types-aiofiles>=25.1.0.20261107,<26",
]

[project.scripts]
acessilia = "frontend.cli.run:main"
# Alias deprecado do nome antigo; remover no próximo ciclo.
bot-acess = "frontend.cli.run:main"

[tool.uv.sources]
# O núcleo puro vive em libs/docstruct e é instalado editável a partir do repo.
acessilia-docstruct = { path = "libs/docstruct", editable = true }
# O SDK vive em libs/sdk enquanto não tiver repositório próprio.
acessilia-sdk = { path = "libs/sdk", editable = true }
# The core lives in libs/core (ADR-0016, step 6).
acessilia-core = { path = "libs/core", editable = true }

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
# A hung test fails with its name instead of consuming the CI job timeout.
# Tests that legitimately need longer override it with @pytest.mark.timeout.
timeout = 180
markers = [
    "e2e: requires a running Acessilia Toolbox at TOOLBOX_BASE_URL or Core API at CORE_BASE_URL",
    "integration: expensive in-process handler/pipeline test; run in the dedicated integration job",
    "slow: expensive test; part of make test-all and local full runs",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["var", "tests/dataset", "docs/notebooks"]

[tool.ruff.lint]
# Enforced rule set (#366, #648): Pyflakes (F), import sorting (I) and
# pycodestyle errors (E), excluding line-length (E501) so existing files are
# not mass-reformatted. Import sorting was enabled at zero violations; the
# shrinking baseline tracks the remaining F/E violations.
select = ["F", "I", "E"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Keep aliased re-exports compact when they come from the same module (#722).
combine-as-imports = true
# Collapse imports to one line whenever they fit, regardless of the source's
# trailing comma, so the style does not depend on how the block was written (#725).
split-on-trailing-comma = false
known-first-party = [
    "acessilia_core",
    "acessilia_sdk",
    "backend",
    "docstruct",
    "frontend",
    "scripts",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
mypy_path = [".", "libs/docstruct/src", "libs/sdk/src", "libs/core/src"]
files = [
    "libs/docstruct/src/docstruct",
    "libs/sdk/src/acessilia_sdk",
    "libs/core/src/acessilia_core",
    "backend",
]
explicit_package_bases = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
check_untyped_defs = true
