[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-acess"
version = "0.1.0"
description = "Bot para extração e acessibilidade de documentos."
authors = [{name = "Jhonata"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "loguru>=0.7.3,<0.8",
    "aiosmtplib>=5.1.2,<6",
    "opencv-python>=5.0.0.93,<6",
    "edge-tts>=7.2.8,<8",
    "numpy>=2.4.6,<3",
    "pypdf>=6.14.2,<7",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.30,<0.31",
    "aiogram>=3.13,<4",
    "pymupdf>=1.24,<2",
    "pillow>=10.4,<11",
    "httpx>=0.27,<0.28",
    "reportlab>=4.2,<5",
    "python-docx>=1.1.2,<2",
    "python-dotenv>=1.0,<2",
    "slowapi>=0.1.10,<0.2",
    "latex2mathml>=3.77.0,<4",
    "python-multipart>=0.0.32,<0.1",
    "jinja2>=3.1.6,<4",
    "agno>=2.7.2,<3",
    "jsonschema>=4.20,<5",
    "openai>=2.45.0,<3",
    "ollama>=0.6.2,<0.7",
    "sqlalchemy>=2.0.51,<3",
    "babel>=2.18.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "respx>=0.23.1,<0.24",
    "pytest-asyncio>=1.4.0,<2",
]

[project.scripts]
bot-acess = "frontend.cli.run:main"

[tool.setuptools.packages]
include = ["backend", "backend.*", "frontend", "frontend.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "e2e: requires a running Acessilia Toolbox instance at TOOLBOX_BASE_URL",
]