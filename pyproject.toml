[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acessilia"
version = "0.1.0"
description = "Extração, classificação e conversão de documentos (PDF, DOCX, imagens) em formatos acessíveis com LLMs, servidas por API REST, painel web, bot do Telegram e CLI."
authors = [{name = "Jhonata"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "loguru>=0.7.3,<0.8",
    "aiosmtplib>=5.1.2,<6",
    "edge-tts>=7.2.8,<8",
    "fastapi>=0.115,<0.116",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<0.31",
    "aiogram>=3.13,<4",
    "httpx>=0.27,<0.28",
    "reportlab>=4.2,<5",
    # Hard requirement of reportlab; pinned here so the image and CI resolve the same major.
    "pillow>=10.4,<11",
    "python-dotenv>=1.0,<2",
    "slowapi>=0.1.10,<0.2",
    "latex2mathml>=3.77.0,<4",
    "python-multipart>=0.0.32,<0.1",
    "jinja2>=3.1.6,<4",
    "agno==3.0.5",
    "jsonschema>=4.20,<5",
    "openai>=2.45.0,<3",
    "ollama>=0.6.2,<0.7",
    "sqlalchemy>=2.0.51,<3",
    "babel>=2.18.0,<3",
    # Núcleo puro de processamento estrutural (libs/docstruct, instalado editável)
    "acessilia-docstruct",
    # Acesso às capacidades da Toolbox pelo contrato HTTP (libs/sdk, instalado editável)
    "acessilia-sdk",
]

[project.urls]
Homepage = "https://github.com/A11yDevs/acessilia"
Repository = "https://github.com/A11yDevs/acessilia"
Issues = "https://github.com/A11yDevs/acessilia/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "respx>=0.23.1,<0.24",
    "pytest-asyncio>=1.4.0,<2",
    # Levenshtein accelerator of docstruct's text_ed; `scripts.bench score`
    # falls back to pure Python without it (~20 s for a 3,000-character page).
    "rapidfuzz>=3.9,<4",
    # Reads the PDFs the renderer tests produce.
    "pypdf>=6.14.2,<7",
    # Builds and renders test PDFs (tests/toolbox_render_fake.py and fixtures);
    # the application renders and extracts only on the Toolbox.
    "pymupdf>=1.24,<2",
]

[project.scripts]
acessilia = "frontend.cli.run:main"
# Alias deprecado do nome antigo; remover no próximo ciclo.
bot-acess = "frontend.cli.run:main"

[tool.uv.sources]
# O núcleo puro vive em libs/docstruct e é instalado editável a partir do repo.
acessilia-docstruct = { path = "libs/docstruct", editable = true }
# O SDK vive em libs/sdk enquanto não tiver repositório próprio.
acessilia-sdk = { path = "libs/sdk", editable = true }

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "e2e: requires a running Acessilia Toolbox instance at TOOLBOX_BASE_URL",
]
