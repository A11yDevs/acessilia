[tool.poetry]
name = "bot-acess"
version = "0.2.0"
description = "Bot para extração e acessibilidade de documentos."
authors = ["Jhonata"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "backend" },
    { include = "frontend" }
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.11"

loguru = "^0.7.3"
aiosmtplib = "^5.1.2"
opencv-python = "^5.0.0.93"
edge-tts = "^7.2.8"
numpy = "^2.4.6"
pypdf = "^6.14.2"
fastapi = "^0.115"
uvicorn = "^0.30"
aiogram = "^3.13"
pymupdf = "^1.24"
pillow = "^10.4"
httpx = "^0.27"
reportlab = "^4.2"
python-docx = "^1.1.2"
python-dotenv = "^1.0"
docling = { version = "^2.87.0", optional = true }
rapidocr = { version = "^3.9.1", optional = true }
slowapi = "^0.1.10"
python-multipart = "^0.0.32"
jinja2 = "^3.1.6"
agno = "^2.7.2"
jsonschema = "^4.20"
openai = "^2.45.0"
ollama = "^0.6.2"
sqlalchemy = "^2.0.51"
opentelemetry-sdk = { version = "^1.30", optional = true }
opentelemetry-exporter-otlp-proto-http = { version = "^1.30", optional = true }
openinference-instrumentation-agno = { version = "^0.1.16", optional = true }
prometheus-fastapi-instrumentator = { version = "^7.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
respx = "^0.23.1"
pytest-asyncio = "^1.4.0"
locust = "^2.32"

[tool.poetry.extras]
docling = ["docling", "rapidocr"]
observability = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "openinference-instrumentation-agno",
    "prometheus-fastapi-instrumentator",
]


[tool.poetry.scripts]
bot-acess = "frontend.cli.run:main"

[tool.pytest.ini_options]
# observability/ tem testes próprios (instrumentacao/), por isso entra aqui.
# testes_de_carga roda pelo Locust e precisa do servidor no ar; fica de fora.
testpaths = ["tests", "observability"]
norecursedirs = ["observability/testes_de_carga", "observability/stack", "tests/fixtures"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "docling: requires the optional Docling stack and its model downloads",
]
