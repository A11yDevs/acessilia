services:
  acessilia:
    # TRACK_TAG (definido no .env): "develop" fora do BHS, "release-x.y.z" durante o ciclo
    image: ghcr.io/a11ydevs/acessilia:${TRACK_TAG:-develop}
    container_name: acessilia-staging
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./var:/app/var
    env_file:
      - .env
    environment:
      TOOLBOX_API_KEY: ${TOOLBOX_API_KEY:-}
      PIPELINE_ENGINE: pddl
      # The Toolbox runs on this same host and publishes 8002. Pointing
      # TOOLBOX_BASE_URL at the public reverse-proxy URL makes every job depend
      # on the host resolving its own public name, which split-horizon DNS does
      # not guarantee: the container then fails with "Temporary failure in name
      # resolution" and no document is processed at all. The loopback address
      # keeps the extraction on the host.
      #
      # This entry wins over env_file, so it also overrides a stale
      # TOOLBOX_BASE_URL in .env. The override knob is deliberately a different
      # name: interpolating TOOLBOX_BASE_URL here would be shadowed by the .env
      # value and the default would never apply. Set STAGING_TOOLBOX_BASE_URL to
      # use a Toolbox that lives elsewhere.
      TOOLBOX_BASE_URL: ${STAGING_TOOLBOX_BASE_URL:-http://host.docker.internal:8002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if echo \"$ENABLED_INTERFACES\" | grep -q 'api'; then curl -fsS http://localhost:8000/api/v1/health; else curl -fsS http://localhost:8001/; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s