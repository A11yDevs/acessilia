[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acessilia-core"
version = "0.3.4"
description = "Acessilia's core: the PDDL pipeline that plans and executes a document's accessibility, with its agents, enrichment stages and exporters (ADR-0016)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The libraries ADR-0016 allows the core (tests/test_boundary.py checks
# the imports). openai and ollama are what Agno's model classes load; rapidfuzz
# accelerates docstruct.fusion.payload.page_similarity; edge-tts is the audio
# export's recorded deviation (ADR-0003, acessilia-toolbox#73).
# docstruct and the SDK are not on an index: install ./libs/docstruct and
# ./libs/sdk first; uv resolves them from the paths below.
dependencies = [
    "acessilia-docstruct>=0.5.8,<0.6",
    "acessilia-sdk>=0.6,<0.7",
    "agno==3.0.5",
    "openai>=2.45.0,<3",
    "ollama>=0.6.2,<0.7",
    "pydantic>=2.10,<3",
    "loguru>=0.7.3,<0.8",
    "babel>=2.18.0,<3",
    "jsonschema>=4.20,<5",
    "rapidfuzz>=3.9,<4",
    "edge-tts>=7.3.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.4.0,<2", "respx>=0.23.1,<0.24"]

[tool.uv.sources]
acessilia-docstruct = { path = "../docstruct", editable = true }
acessilia-sdk = { path = "../sdk", editable = true }

[tool.hatch.build.targets.wheel]
# The package's data travels with it: the PDDL domains, the prompts and the
# translation catalogs' .po sources (the .mo files are git-ignored and the
# runtime does not read them).
packages = ["src/acessilia_core"]
exclude = ["**/*.mo", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
