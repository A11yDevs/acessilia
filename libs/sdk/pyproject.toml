[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acessilia-sdk"
version = "0.1.0"
description = "Acesso uniforme às capacidades do Acessilia: registro de contratos da Toolbox, transporte HTTP e clientes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<0.28"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.4.0,<2", "respx>=0.23.1,<0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/acessilia_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
