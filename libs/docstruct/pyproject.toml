[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acessilia-docstruct"
version = "0.5.8"
description = "Núcleo puro de processamento estrutural de documentos: tipos canônicos, geometria, fusão multi-provider e filtros de ruído."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/docstruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
