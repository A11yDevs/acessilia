name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: a11ydevs/acessilia

jobs:
  publish:
    name: publish ${{ matrix.variant }} release image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: docling
            with_docling: "true"
            tag_suffix: ""
          - variant: slim
            with_docling: "false"
            tag_suffix: -slim

    env:
      LOCAL_IMAGE: acessilia:release-${{ matrix.variant }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=acessilia
            org.opencontainers.image.description=Pipeline para extracao e acessibilidade de documentos
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build production image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          target: base
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            WITH_DOCLING=${{ matrix.with_docling }}
          cache-from: type=gha,scope=production-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.variant }}

      - name: Verify installed variant and empty model caches
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm --interactive \
            --env VARIANT \
            "$LOCAL_IMAGE" \
            python - <<'PY'
          import os
          from importlib.metadata import distributions

          installed = {
              distribution.metadata["Name"].lower().replace("_", "-")
              for distribution in distributions()
              if distribution.metadata["Name"]
          }
          if os.environ["VARIANT"] == "slim":
              unexpected = {"docling", "rapidocr", "torch", "torchvision"} & installed
              if unexpected:
                  raise SystemExit(f"Pacotes inesperados na imagem slim: {unexpected}")
          else:
              import torch
              if torch.version.cuda is not None:
                  raise SystemExit(f"Torch CUDA detectado: {torch.version.cuda}")
              accelerators = {"triton"} & installed
              accelerators |= {name for name in installed if name.startswith("nvidia-")}
              if accelerators:
                  raise SystemExit(f"Aceleradores inesperados: {accelerators}")
          PY
          docker run --rm "$LOCAL_IMAGE" sh -c \
            'test -z "$(find /app/var/cache -type f 2>/dev/null)"'

      - name: Smoke test API health
        run: |
          container_id=$(docker run --detach --rm \
            --env ENABLED_INTERFACES=api \
            --publish 127.0.0.1::8000 \
            "$LOCAL_IMAGE" \
            python -m uvicorn backend.api.app:app --host 0.0.0.0 --port 8000)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container_id" 8000/tcp | awk -F: '{print $NF}')
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-connrefused --retry-delay 2 \
            "http://127.0.0.1:${port}/api/v1/health"

      - name: Enforce local image size guardrail
        run: python scripts/check_image_size.py local "$LOCAL_IMAGE" --limit-gb 9

      - name: Publish verified release image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          target: base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_DOCLING=${{ matrix.with_docling }}
          cache-from: type=gha,scope=production-${{ matrix.variant }}

  release:
    name: create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag