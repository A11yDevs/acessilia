name: Security

on:
  workflow_call:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"
          enable-cache: true

      - name: Check the lock is current
        run: uv lock --check

      - name: Export locked dependencies
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project \
            --output-file requirements-audit.txt

      - name: Audit known vulnerabilities
        run: uvx pip-audit --requirement requirements-audit.txt

  image-changes:
    name: Detect image changes
    # This job must run on every event, not only on pull requests. GitHub
    # evaluates a caller's `needs` on a reusable workflow by the individual
    # jobs inside it: a job skipped here makes the whole `security` call count
    # as skipped, and `publish verified images` in ci.yml is then skipped
    # without a failure (the regression from #644 on 2026-11-23). Outside a
    # pull request the filter step is skipped and the output is "true"; the
    # scan ignores that output for those events anyway.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.filter.outputs.image || steps.assume.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Filter image paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            image:
              - 'infra/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'libs/**/pyproject.toml'
              - 'libs/**/uv.lock'
              - '.dockerignore'
              - '.python-version'
              - '.trivyignore'
              - '.github/workflows/security.yml'

      - name: Report the image as changed outside a pull request
        id: assume
        if: github.event_name != 'pull_request'
        run: echo "image=true" >> "$GITHUB_OUTPUT"

  container-scan:
    name: Container image scan
    needs: image-changes
    if: "!cancelled() && (github.event_name != 'pull_request' || needs.image-changes.outputs.image != 'false')"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Date the apt security refresh
        id: apt-refresh
        # The image's apt layer is rebuilt once a day from the GHA cache (#753).
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: acessilia:security-scan
          build-args: |
            APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
            GIT_COMMIT=${{ github.sha }}
            IMAGE_TAG=security-scan
          # A cached apt layer can hide Debian security updates (krb5 in
          # #750), so the gate must build and scan a fresh image.
          no-cache: true
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: List the image findings for the log
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: acessilia:security-scan
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          output: trivy-results.txt

      - name: Show the image findings
        run: cat trivy-results.txt

      - name: Scan the image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: acessilia:security-scan
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload the scan report
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: container
