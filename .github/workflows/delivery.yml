name: Delivery

on:
  workflow_call:
    inputs:
      ref:
        description: Commit a publicar
        required: true
        type: string
      branch:
        description: Branch associada ao commit
        required: true
        type: string
      sha:
        description: SHA completo do commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit a publicar
        required: true
        type: string
      branch:
        description: Branch associada ao commit
        required: true
        type: string
      sha:
        description: SHA completo do commit
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-${{ inputs.branch }}
  cancel-in-progress: ${{ inputs.branch != 'main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: a11ydevs/acessilia

jobs:
  publish:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          BRANCH="${{ inputs.branch }}"
          SHA="${{ inputs.sha }}"
          # Docker tags nao aceitam "/" (ex: release/0.0.1 -> release-0.0.1)
          SAFE_BRANCH="${BRANCH//\//-}"

          TAGS="${REGISTRY}/${IMAGE_NAME}:${SAFE_BRANCH}"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${SHA:0:7}"

          if [ "$BRANCH" = "main" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Build production image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: acessilia:delivery
          build-args: |
            GIT_COMMIT=${{ inputs.sha }}
            IMAGE_TAG=${{ steps.tags.outputs.branch }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Smoke test API health
        run: |
          container_id=$(docker run --detach --rm \
            --env ENABLED_INTERFACES=api \
            --publish 127.0.0.1::8000 \
            acessilia:delivery \
            python -m uvicorn backend.api.app:app --host 0.0.0.0 --port 8000)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container_id" 8000/tcp | awk -F: '{print $NF}')
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-connrefused --retry-delay 2 \
            "http://127.0.0.1:${port}/api/v1/health"

      - name: Enforce local image size guardrail
        run: python scripts/check_image_size.py local acessilia:delivery --limit-gb 9

      - name: Publish verified production image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=acessilia
            org.opencontainers.image.description=Pipeline para extracao e acessibilidade de documentos
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ inputs.sha }}

      - name: Enforce published image size guardrail
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python scripts/check_image_size.py remote \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --limit-gb 9 | tee image-size.txt
          {
            echo '```text'
            cat image-size.txt
            echo '```'
            echo "digest=${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show immutable image reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
