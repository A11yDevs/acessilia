name: Delivery

on:
  workflow_call:
    inputs:
      ref:
        description: Commit a publicar
        required: true
        type: string
      branch:
        description: Branch associada ao commit
        required: true
        type: string
      sha:
        description: SHA completo do commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit a publicar
        required: true
        type: string
      branch:
        description: Branch associada ao commit
        required: true
        type: string
      sha:
        description: SHA completo do commit
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-${{ inputs.branch }}
  cancel-in-progress: ${{ inputs.branch != 'main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: a11ydevs/acessilia

jobs:
  publish:
    name: publish image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          BRANCH="${{ inputs.branch }}"
          SHA="${{ inputs.sha }}"
          # Docker tags nao aceitam "/" (ex: release/0.0.1 -> release-0.0.1)
          SAFE_BRANCH="${BRANCH//\//-}"

          TAGS="${REGISTRY}/${IMAGE_NAME}:${SAFE_BRANCH}"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:sha-${SHA:0:7}"

          if [ "$BRANCH" = "main" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "branch=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Build production image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: acessilia:delivery
          build-args: |
            GIT_COMMIT=${{ inputs.sha }}
            IMAGE_TAG=${{ steps.tags.outputs.branch }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Smoke test API health
        run: |
          container_id=$(docker run --detach --rm \
            --env ENABLED_INTERFACES=api \
            --publish 127.0.0.1::8000 \
            acessilia:delivery \
            python -m uvicorn backend.api.app:app --host 0.0.0.0 --port 8000)
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container_id" 8000/tcp | awk -F: '{print $NF}')
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-connrefused --retry-delay 2 \
            "http://127.0.0.1:${port}/api/v1/health"

      - name: Enforce local image size guardrail
        run: python scripts/check_image_size.py local acessilia:delivery --limit-gb 0.5

      - name: Publish verified production image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # The published image must carry the same build identity it was
          # verified with; otherwise /api/v1/health reports an empty
          # git_commit/image_tag and the running commit cannot be proven.
          build-args: |
            GIT_COMMIT=${{ inputs.sha }}
            IMAGE_TAG=${{ steps.tags.outputs.branch }}
          labels: |
            org.opencontainers.image.title=acessilia
            org.opencontainers.image.description=Pipeline para extracao e acessibilidade de documentos
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ inputs.sha }}

      - name: Enforce published image size guardrail
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          python scripts/check_image_size.py remote \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" --limit-gb 0.5 | tee image-size.txt
          {
            echo '```text'
            cat image-size.txt
            echo '```'
            echo "digest=${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show immutable image reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
