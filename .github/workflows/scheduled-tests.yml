name: Scheduled test monitoring

on:
  schedule:
    # Mondays at 06:00 UTC. The schedule starts on the default branch, but
    # every matrix job checks out the ref it monitors.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-test-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    name: serial and parallel suite (${{ matrix.ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: [main, develop]

    steps:
      - name: Check out ${{ matrix.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install "./libs/sdk[dev]" --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir

      - name: Check the Toolbox capability contract
        env:
          TARGET_BRANCH: ${{ matrix.ref }}
        run: |
          TOOLBOX_REF=$(python scripts/toolbox_contract_ref.py "$TARGET_BRANCH")
          url="https://raw.githubusercontent.com/A11yDevs/acessilia-toolbox/${TOOLBOX_REF}/contract/toolbox-contract.json"
          echo "Toolbox contract: $url"
          if ! curl --fail --silent --show-error --location --retry 3 \
              --output "$RUNNER_TEMP/toolbox-contract.json" "$url"; then
            echo "::error::Failed to download the Toolbox contract from ${TOOLBOX_REF}."
            exit 1
          fi
          python scripts/check_capability_contract.py --snapshot "$RUNNER_TEMP/toolbox-contract.json"

      # The scheduled job changes the execution order and worker count. A test
      # with a different outcome is an order/worker dependency; the comparison
      # step below fails the run.
      - name: Run core suite serially
        continue-on-error: true
        run: python -m pytest -m "not e2e" --durations=25 --junitxml=serial-results.xml

      - name: Run core suite with four workers
        continue-on-error: true
        run: python -m pytest -m "not e2e" -n 4 --dist worksteal --durations=25 --junitxml=parallel-results.xml

      - name: Run docstruct library test suite
        continue-on-error: true
        working-directory: libs/docstruct
        run: python -m pytest --durations=25 --junitxml=docstruct-test-results.xml

      - name: Run SDK library test suite
        continue-on-error: true
        working-directory: libs/sdk
        run: python -m pytest --durations=25 --junitxml=sdk-test-results.xml

      - name: Compare outcomes and write the monitoring summary
        if: always()
        run: |
          python scripts/test_report.py \
            serial-results.xml parallel-results.xml \
            --fail-on-skip \
            --json test-monitoring-summary.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Check docstruct and SDK reports
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          from scripts.test_report import parse_report

          failed = False
          for path in (
              Path("libs/docstruct/docstruct-test-results.xml"),
              Path("libs/sdk/sdk-test-results.xml"),
          ):
              try:
                  suite = parse_report(path, str(path))
              except Exception as exc:
                  print(f"error: {path}: {exc}")
                  failed = True
                  continue
              print(
                  f"{path}: {suite.tests} tests, {suite.failed} failed, "
                  f"{suite.errors} errors, {suite.skipped} skipped"
              )
              if suite.tests == 0 or suite.failed or suite.errors or suite.skipped:
                  failed = True
          raise SystemExit(1 if failed else 0)
          PY

      # Strict here, report-only in pull requests (#470, P8): a Toolbox pin
      # behind the core's docstruct release fails the run and reaches the
      # tracking issue, without blocking work that cannot fix it.
      - name: Check the Toolbox's docstruct pin
        if: always()
        env:
          TARGET_BRANCH: ${{ matrix.ref }}
        run: python scripts/check_docstruct_pin.py "$TARGET_BRANCH"

      - name: Upload scheduled test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-test-reports-${{ matrix.ref }}
          path: |
            serial-results.xml
            parallel-results.xml
            libs/docstruct/docstruct-test-results.xml
            libs/sdk/sdk-test-results.xml
            test-monitoring-summary.json
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: E2E against the configured environment
    # Repository variables enable this job; without either URL it is skipped.
    if: ${{ vars.TOOLBOX_BASE_URL != '' || vars.CORE_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install "./libs/sdk[dev]" --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir

      - name: Run end-to-end tests
        env:
          TOOLBOX_BASE_URL: ${{ vars.TOOLBOX_BASE_URL }}
          TOOLBOX_API_KEY: ${{ secrets.TOOLBOX_API_KEY }}
          CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
          CORE_EXPECT_BUILD_INFO: ${{ vars.CORE_EXPECT_BUILD_INFO }}
        run: python -m pytest -m e2e -v --timeout=900 --durations=25 --junitxml=e2e-results.xml

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-e2e-report
          path: e2e-results.xml
          if-no-files-found: ignore
          retention-days: 30

  notify:
    name: Open or update the failure issue
    if: ${{ always() && failure() && github.event_name == 'schedule' }}
    needs:
      - monitor
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Scheduled test monitoring failed"
          body=$(cat <<EOF
          The weekly scheduled test monitoring failed for one or more of
          main/develop.

          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Event: ${GITHUB_EVENT_NAME}

          See the run summary and the serial/parallel artifacts for the failing ref.
          EOF
          )
          issue=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
