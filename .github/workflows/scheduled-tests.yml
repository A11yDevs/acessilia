name: Scheduled test monitoring

on:
  schedule:
    # Mondays at 06:00 UTC; the default branch is the branch that runs.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-test-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    name: serial and parallel suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install "./libs/sdk[dev]" --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir

      - name: Check the Toolbox capability contract
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          TOOLBOX_REF=$(python scripts/toolbox_contract_ref.py "$TARGET_BRANCH")
          url="https://raw.githubusercontent.com/A11yDevs/acessilia-toolbox/${TOOLBOX_REF}/contract/toolbox-contract.json"
          echo "Toolbox contract: $url"
          if ! curl --fail --silent --show-error --location --retry 3 \
              --output "$RUNNER_TEMP/toolbox-contract.json" "$url"; then
            echo "::error::Failed to download the Toolbox contract from ${TOOLBOX_REF}."
            exit 1
          fi
          python scripts/check_capability_contract.py --snapshot "$RUNNER_TEMP/toolbox-contract.json"

      # The scheduled job changes the execution order and worker count. A test
      # with a different outcome is an order/worker dependency; the comparison
      # step below fails the run.
      - name: Run core suite serially
        continue-on-error: true
        run: python -m pytest -m "not e2e" --durations=25 --junitxml=serial-results.xml

      - name: Run core suite with four workers
        continue-on-error: true
        run: python -m pytest -m "not e2e" -n 4 --dist worksteal --durations=25 --junitxml=parallel-results.xml

      - name: Run docstruct library test suite
        working-directory: libs/docstruct
        run: python -m pytest --durations=25 --junitxml=docstruct-test-results.xml

      - name: Run SDK library test suite
        working-directory: libs/sdk
        run: python -m pytest --durations=25 --junitxml=sdk-test-results.xml

      - name: Compare outcomes and write the monitoring summary
        if: always()
        run: |
          python scripts/test_report.py \
            serial-results.xml parallel-results.xml \
            --fail-on-skip \
            --json test-monitoring-summary.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload scheduled test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-test-reports
          path: |
            serial-results.xml
            parallel-results.xml
            libs/docstruct/docstruct-test-results.xml
            libs/sdk/sdk-test-results.xml
            test-monitoring-summary.json
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: E2E against the configured environment
    # Repository variables enable this job; without either URL it is skipped.
    if: ${{ vars.TOOLBOX_BASE_URL != '' || vars.CORE_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install "./libs/sdk[dev]" --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir

      - name: Run end-to-end tests
        env:
          TOOLBOX_BASE_URL: ${{ vars.TOOLBOX_BASE_URL }}
          TOOLBOX_API_KEY: ${{ secrets.TOOLBOX_API_KEY }}
          CORE_BASE_URL: ${{ vars.CORE_BASE_URL }}
          CORE_EXPECT_BUILD_INFO: ${{ vars.CORE_EXPECT_BUILD_INFO }}
        run: python -m pytest -m e2e -v --timeout=900 --durations=25 --junitxml=e2e-results.xml

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-e2e-report
          path: e2e-results.xml
          if-no-files-found: ignore
          retention-days: 30
