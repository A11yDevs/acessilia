name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # During BHS a release branch only takes bug fixes (CONTRIBUTING.md, 5.1);
  # features, improvements and refactorings keep going to develop.
  release-scope:
    name: release accepts only fixes
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject branches that are not fixes
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in
            fix/*|hotfix/*) echo "${HEAD_REF} -> ${BASE_REF}: ok" ;;
            *)
              echo "::error::${BASE_REF} only accepts fix/* and hotfix/* branches during BHS; target develop with ${HEAD_REF}."
              exit 1
              ;;
          esac

  # Shadow mode for the architecture-aware selection of #644. It records what
  # an impact-aware CI would run; it does not skip any suite or gate.
  detect-changes:
    name: detect changed components (shadow)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Fetch the base branch
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Select impacted suites in shadow mode
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Standard-library-only tooling; no project install is needed.
          python scripts/tests/select_suites.py \
            --base-ref "origin/${BASE_REF}" --head-ref HEAD \
            --output var/selection.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the shadow selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-selection-shadow
          path: var/selection.json
          if-no-files-found: ignore
          retention-days: 30

  # The SDK is a public API for scripts and benchmarks (#402): it must install
  # and run with neither the core nor docstruct present.
  sdk-isolated:
    name: SDK alone (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-sdk-py${{ matrix.python-version }}-${{ hashFiles('libs/sdk/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-sdk-py${{ matrix.python-version }}-

      - name: Install the SDK alone from its lock
        run: |
          # The SDK's project dependencies (ADR-0002): its operations compose
          # Toolbox capabilities with docstruct's algorithms, and its i18n
          # infrastructure uses Babel (#712).
          # --locked keeps this extra check reproducible from its own lock, and
          # --no-editable installs the wheel users install.
          uv lock --check --project libs/sdk
          uv sync --locked --extra dev --project libs/sdk --no-editable

      - name: Check that the core is not importable
        working-directory: libs/sdk
        run: |
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/sdk" python - <<'PY'
          import importlib.util

          present = [
              name
              for name in ("backend", "acessilia_core", "acessilia_toolbox", "agno", "fastapi")
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              raise SystemExit(f"importable next to the SDK: {present}")
          print("The SDK is installed alone.")
          PY

      - name: Run the SDK test suite
        working-directory: libs/sdk
        run: uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/sdk" python -m pytest -rs --junitxml=sdk-isolated-results.xml

      - name: Run the command line
        working-directory: libs/sdk
        run: |
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/sdk" python -m acessilia_sdk --help
          # Nothing listens on port 9: a typed transport error and exit status 1.
          status=0
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/sdk" python -m acessilia_sdk \
            --endpoint http://127.0.0.1:9 --timeout 2 catalog \
            2> "$RUNNER_TEMP/cli-error.txt" || status=$?
          cat "$RUNNER_TEMP/cli-error.txt"
          test "$status" -eq 1
          grep -q '^error: ToolboxProviderUnavailable: ' "$RUNNER_TEMP/cli-error.txt"

      - name: Reject unexpected skipped tests
        working-directory: libs/sdk
        run: |
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/sdk" python - <<'PY'
          from xml.etree import ElementTree

          root = ElementTree.parse("sdk-isolated-results.xml").getroot()
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"{skipped} SDK test(s) skipped without the core.")
          print("No SDK test was skipped.")
          PY

      - name: Upload SDK isolation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-isolated-report-py${{ matrix.python-version }}
          path: libs/sdk/sdk-isolated-results.xml
          if-no-files-found: ignore
          retention-days: 7

  # The core is a package of its own (ADR-0016, step 6): it must install
  # from its lock without the service or the front ends, and work from the
  # wheel, with its PDDL domains, prompts and catalogs as package data.
  core-isolated:
    name: core alone (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-core-py${{ matrix.python-version }}-${{ hashFiles('libs/core/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-core-py${{ matrix.python-version }}-

      - name: Install the core alone from its lock
        run: |
          # --no-editable installs the wheel users install, so the package
          # data must travel in it.
          uv lock --check --project libs/core
          uv sync --locked --extra dev --project libs/core --no-editable

      - name: Check that the service is not importable
        working-directory: ${{ runner.temp }}
        run: |
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/core" python - <<'PY'
          import importlib.util
          import acessilia_core

          present = [
              name
              for name in ("backend", "frontend", "fastapi", "acessilia_toolbox")
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              raise SystemExit(f"importable next to the core: {present}")
          if "site-packages" not in (acessilia_core.__file__ or ""):
              raise SystemExit(f"the core does not come from its wheel: {acessilia_core.__file__}")
          print("The core is installed alone, from its wheel.")
          PY

      - name: Run the core library test suite from the wheel
        working-directory: libs/core
        run: uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/core" python -m pytest -rs --junitxml=core-isolated-results.xml tests

      - name: Run the smoke test outside the checkout
        run: |
          # Importing the modules alone would not load the domains, the
          # prompts or the catalogs: the smoke test uses them all.
          mkdir -p "$RUNNER_TEMP/core-smoke"
          cp libs/core/tests/test_smoke.py "$RUNNER_TEMP/core-smoke/"
          cd "$RUNNER_TEMP/core-smoke"
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/core" \
            python -m pytest -rs --junitxml=core-smoke-results.xml test_smoke.py

      - name: Run the table stage from a script
        run: |
          # ADR-0016's proof of concept, where the service is not even
          # installed: an explicit CoreConfig and a runner of its own.
          cd "$RUNNER_TEMP/core-smoke"
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/core" \
            python "$GITHUB_WORKSPACE/libs/core/examples/table_stage.py" \
            "$GITHUB_WORKSPACE/libs/core/examples/fixtures/tables_manifest.json" \
            "$RUNNER_TEMP/core-smoke/tables.pdf" "$RUNNER_TEMP/core-smoke/tables.json"
          grep -q '"table_linearization_hint": "text-heuristic"' "$RUNNER_TEMP/core-smoke/tables.json"

      - name: Reject unexpected skipped tests
        working-directory: ${{ runner.temp }}/core-smoke
        run: |
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/core" python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          reports = [
              Path("core-smoke-results.xml"),
              Path(os.environ["GITHUB_WORKSPACE"]) / "libs/core/core-isolated-results.xml",
          ]
          skipped = 0
          for report in reports:
              root = ElementTree.parse(report).getroot()
              skipped += sum(
                  int(suite.attrib.get("skipped", "0"))
                  for suite in root.iter("testsuite")
              )
          if skipped:
              raise SystemExit(f"{skipped} core test(s) skipped.")
          print("No core test was skipped.")
          PY

  # docstruct is the pure structural core under the core, the SDK and the
  # Toolbox (ADR-0002, ADR-0017): it must install from its wheel and pass its
  # runtime on the standard library alone, without its optional accelerator.
  # jsonschema is a development-only engine for the injected validation tests.
  docstruct-isolated:
    name: docstruct alone (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-docstruct-py${{ matrix.python-version }}-${{ hashFiles('libs/docstruct/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-docstruct-py${{ matrix.python-version }}-

      - name: Install docstruct alone from its lock
        run: |
          # The library's own lock builds and tests it on its own; the gate for
          # the application is the root environment. --no-editable installs the
          # wheel that is published.
          uv lock --check --project libs/docstruct
          uv sync --locked --extra dev --project libs/docstruct --no-editable

      - name: Check that no other project package or accelerator is importable
        working-directory: libs/docstruct
        run: |
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/docstruct" python - <<'PY'
          import importlib.util
          from pathlib import Path

          import docstruct

          present = [
              name
              for name in (
                  "backend", "acessilia_core", "acessilia_sdk", "acessilia_toolbox", "agno",
                  "fastapi", "pydantic", "httpx", "rapidfuzz",
              )
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              raise SystemExit(f"importable next to docstruct: {present}")
          # The suite must test the installed wheel, not the source tree.
          location = Path(docstruct.__file__).resolve()
          if "site-packages" not in location.parts:
              raise SystemExit(f"docstruct imported from {location}, not from the wheel")
          print(f"docstruct is installed alone: {location.parent}")
          PY

      - name: Validate the bundled canonical schema away from the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/libs/docstruct/.venv/bin/python" -I - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          from jsonschema import Draft202012Validator, ValidationError, validate
          from docstruct.canonical import build_canonical_document
          from docstruct.schemas import accessible_document_schema
          from docstruct.validation import validate_against_schema

          resource = files("docstruct.schemas").joinpath("accessible_document.schema.json")
          if "site-packages" not in Path(str(resource)).parts:
              raise SystemExit(f"schema is not from the installed wheel: {resource}")
          Draft202012Validator.check_schema(accessible_document_schema())
          document = build_canonical_document("# Main\n\nBody.\n\n## Child\n\nChild text.")
          validate_against_schema(document, validate)
          document["sections"][0]["children"][0]["blocks"][0]["type"] = "custom"
          try:
              validate_against_schema(document, validate)
          except ValidationError:
              pass
          else:
              raise SystemExit("bundled schema did not reject an invalid child")
          print(f"Installed canonical schema validated outside the checkout: {resource}")
          PY

      - name: Run the docstruct test suite
        working-directory: libs/docstruct
        run: uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/docstruct" python -m pytest -rs --junitxml=docstruct-isolated-results.xml

      - name: Reject unexpected skipped tests
        working-directory: libs/docstruct
        run: |
          uv run --locked --extra dev --no-editable --project "$GITHUB_WORKSPACE/libs/docstruct" python - <<'PY'
          from xml.etree import ElementTree

          root = ElementTree.parse("docstruct-isolated-results.xml").getroot()
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"{skipped} docstruct test(s) skipped on the standard library alone.")
          print("No docstruct test was skipped.")
          PY

      - name: Characterize exports in a locked container
        run: |
          docker build --file tests/fixtures/export_snapshots/Dockerfile --tag acessilia-export-characterization .
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro" acessilia-export-characterization

      - name: Upload docstruct isolation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docstruct-isolated-report-py${{ matrix.python-version }}
          path: libs/docstruct/docstruct-isolated-results.xml
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: quality (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.12-

      - name: Check the lock and install from it
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Run Ruff against the shrinking baseline
        run: uv run --locked --extra dev python scripts/check_ruff_baseline.py

      - name: Run Mypy on the configured scope
        run: uv run --locked --extra dev mypy --no-incremental

      - name: Run Mypy on the libraries with Python 3.11
        run: |
          uv run --locked --extra dev mypy --no-incremental --python-version 3.11 \
            libs/docstruct/src/docstruct libs/sdk/src/acessilia_sdk \
            libs/core/src/acessilia_core

      - name: Check the Toolbox capability contract
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          TOOLBOX_REF=$(uv run --locked --extra dev python scripts/toolbox_contract_ref.py "$TARGET_BRANCH")
          url="https://raw.githubusercontent.com/A11yDevs/acessilia-toolbox/${TOOLBOX_REF}/contract/toolbox-contract.json"
          echo "Toolbox contract: $url"
          if ! curl --fail --silent --show-error --location --retry 3 \
              --output "$RUNNER_TEMP/toolbox-contract.json" "$url"; then
            echo "::error::Failed to download the Toolbox contract from ${TOOLBOX_REF} (missing file or network error; see the curl output above)."
            exit 1
          fi
          uv run --locked --extra dev python scripts/check_capability_contract.py --snapshot "$RUNNER_TEMP/toolbox-contract.json"

      - name: Report the Toolbox's docstruct pin
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: uv run --locked --extra dev python scripts/check_docstruct_pin.py "$TARGET_BRANCH" --report-only

  component-tests:
    name: ${{ matrix.component }} tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [app, docstruct, sdk, core]
        include:
          - component: app
            directory: .
          - component: docstruct
            directory: libs/docstruct
          - component: sdk
            directory: libs/sdk
          - component: core
            directory: libs/core
    env:
      UV_PYTHON: "3.12"
      COMPONENT: ${{ matrix.component }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.17"

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.12-

      - name: Check the lock and install from it
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Run ${{ matrix.component }} test suite
        working-directory: ${{ matrix.directory }}
        env:
          COVERAGE_FILE: ${{ github.workspace }}/var/coverage-data/${{ matrix.component }}/.coverage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/var/coverage/$COMPONENT" "$GITHUB_WORKSPACE/var/coverage-data/$COMPONENT" "$GITHUB_WORKSPACE/var/test-results"
          args=()
          coverage=()
          case "$COMPONENT" in
            app) args=(-m "not e2e" -n 4 --dist worksteal); coverage=(backend frontend) ;;
            docstruct) coverage=(docstruct) ;;
            sdk) coverage=(acessilia_sdk) ;;
            core) coverage=(acessilia_core) ;;
            *) echo "::error::unknown component $COMPONENT"; exit 1 ;;
          esac
          cov_args=()
          for target in "${coverage[@]}"; do cov_args+=("--cov=$target"); done
          uv run --locked --extra dev --project "$GITHUB_WORKSPACE" python -m pytest "${args[@]}" --durations=25 \
            --junitxml="$GITHUB_WORKSPACE/var/test-results/$COMPONENT.xml" \
            "${cov_args[@]}" --cov-branch --cov-config="$GITHUB_WORKSPACE/pyproject.toml" \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:"$GITHUB_WORKSPACE/var/coverage/$COMPONENT/coverage.xml" \
            --cov-report=json:"$GITHUB_WORKSPACE/var/coverage/$COMPONENT/coverage.json"

      - name: Check ${{ matrix.component }} coverage threshold
        run: uv run --locked --extra dev python scripts/check_coverage_thresholds.py --coverage-dir var/coverage --components "$COMPONENT"

      - name: Reject unexpected skipped tests
        run: |
          uv run --locked --extra dev python - "$COMPONENT" <<'PY'
          import sys
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("var/test-results") / f"{sys.argv[1]}.xml"
          root = ElementTree.parse(report).getroot()
          skipped = sum(
              int(suite.attrib.get("skipped", "0"))
              for suite in root.iter("testsuite")
          )
          if skipped:
              raise SystemExit(
                  f"CI incompleto: {skipped} teste(s) foram pulado(s) em {report}. "
                  "Consulte os motivos exibidos pelo pytest."
              )
          print(f"Relatorio JUnit validado: {report} sem testes pulados.")
          PY

      - name: Upload component test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ matrix.component }}
          path: var/test-results/${{ matrix.component }}.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload component coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.component }}
          path: var/coverage
          if-no-files-found: ignore
          retention-days: 7

  # This aggregator keeps the required check name while the four suites run
  # in parallel. It publishes the evidence even on failure and fails closed at
  # the end if any provider failed or was skipped.
  tests:
    name: tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - quality
      - component-tests
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # The aggregation scripts are standard-library only; the provider jobs
      # already installed and exercised the project environment.
      - name: Download component coverage reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: var/coverage

      - name: Download component test reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-report-*
          merge-multiple: true
          path: var/test-results

      - name: Check per-component coverage thresholds
        if: always()
        run: python scripts/check_coverage_thresholds.py --coverage-dir var/coverage

      - name: Summarize test timings
        if: always()
        continue-on-error: true
        run: |
          mkdir -p var/timings
          python scripts/tests/collect_timings.py collect \
            --report app=var/test-results/app.xml \
            --report docstruct=var/test-results/docstruct.xml \
            --report sdk=var/test-results/sdk.xml \
            --report core=var/test-results/core.xml \
            --coverage-dir var/coverage \
            --output var/timings/baseline.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Summarize per-component coverage
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          components = (
              ("Application (backend + frontend)", Path("var/coverage/app/coverage.json")),
              ("Core (acessilia_core)", Path("var/coverage/core/coverage.json")),
              ("SDK (acessilia_sdk)", Path("var/coverage/sdk/coverage.json")),
              ("Docstruct (docstruct)", Path("var/coverage/docstruct/coverage.json")),
          )
          lines = [
              "## Test coverage (branch)",
              "",
              "| Component | Coverage | Statements | Branches |",
              "|---|---:|---:|---:|",
          ]
          for label, report in components:
              if not report.exists():
                  lines.append(f"| {label} | — | — | — |")
                  continue
              totals = json.loads(report.read_text(encoding="utf-8")).get("totals", {})
              pct = totals.get("percent_covered_display", "—")
              stmts = f"{totals.get('covered_lines', 0)}/{totals.get('num_statements', 0)}"
              branches = f"{totals.get('covered_branches', 0)}/{totals.get('num_branches', 0)}"
              lines.append(f"| {label} | {pct}% | {stmts} | {branches} |")
          summary = "\n".join(lines) + "\n"
          print(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(summary)
          PY

      - name: Upload combined reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-py3.12
          path: var/test-results/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload combined coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports-py3.12
          path: |
            var/coverage/app/coverage.xml
            var/coverage/app/coverage.json
            var/coverage/core/coverage.xml
            var/coverage/core/coverage.json
            var/coverage/sdk/coverage.xml
            var/coverage/sdk/coverage.json
            var/coverage/docstruct/coverage.xml
            var/coverage/docstruct/coverage.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload timing baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-baseline-py3.12
          path: var/timings/baseline.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify provider jobs
        if: always()
        env:
          QUALITY: ${{ needs.quality.result }}
          COMPONENTS: ${{ needs.component-tests.result }}
        run: |
          failed=0
          for entry in "quality:$QUALITY" "component-tests:$COMPONENTS"; do
            name=${entry%%:*}
            result=${entry#*:}
            if [ "$result" != "success" ]; then
              echo "::error::$name finished as $result"
              failed=1
            fi
          done
          exit "$failed"

  security:
    name: security checks
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  delivery:
    name: publish verified images
    if: >
      github.event_name == 'push' &&
      (
        github.ref_name == 'main' ||
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'release/')
      )
    needs:
      - tests
      - sdk-isolated
      - core-isolated
      - docstruct-isolated
      - security
    uses: ./.github/workflows/delivery.yml
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets: inherit
