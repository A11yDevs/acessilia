name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # During BHS a release branch only takes bug fixes (CONTRIBUTING.md, 5.1);
  # features, improvements and refactorings keep going to develop.
  release-scope:
    name: release accepts only fixes
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reject branches that are not fixes
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$HEAD_REF" in
            fix/*|hotfix/*) echo "${HEAD_REF} -> ${BASE_REF}: ok" ;;
            *)
              echo "::error::${BASE_REF} only accepts fix/* and hotfix/* branches during BHS; target develop with ${HEAD_REF}."
              exit 1
              ;;
          esac

  # The SDK is a public API for scripts and benchmarks (#402): it must install
  # and run with neither the core nor docstruct present.
  sdk-isolated:
    name: SDK alone (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install the SDK alone
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./libs/sdk[dev]" --no-cache-dir

      - name: Check that the core is not importable
        working-directory: libs/sdk
        run: |
          python - <<'PY'
          import importlib.util

          present = [
              name
              for name in ("backend", "docstruct", "acessilia_toolbox", "agno", "fastapi")
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              raise SystemExit(f"importable next to the SDK: {present}")
          print("The SDK is installed alone.")
          PY

      - name: Run the SDK test suite
        working-directory: libs/sdk
        run: python -m pytest -rs --junitxml=sdk-isolated-results.xml

      - name: Run the command line
        working-directory: libs/sdk
        run: |
          python -m acessilia_sdk --help
          # Nothing listens on port 9: a typed transport error and exit status 1.
          status=0
          python -m acessilia_sdk --endpoint http://127.0.0.1:9 --timeout 2 catalog \
            2> "$RUNNER_TEMP/cli-error.txt" || status=$?
          cat "$RUNNER_TEMP/cli-error.txt"
          test "$status" -eq 1
          grep -q '^error: ToolboxProviderUnavailable: ' "$RUNNER_TEMP/cli-error.txt"

      - name: Reject unexpected skipped tests
        working-directory: libs/sdk
        run: |
          python - <<'PY'
          from xml.etree import ElementTree

          root = ElementTree.parse("sdk-isolated-results.xml").getroot()
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"{skipped} SDK test(s) skipped without the core.")
          print("No SDK test was skipped.")
          PY

      - name: Upload SDK isolation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-isolated-report
          path: libs/sdk/sdk-isolated-results.xml
          if-no-files-found: ignore
          retention-days: 7

  # docstruct is the pure structural core under the core, the SDK and the
  # Toolbox (ADR-0002, ADR-0017): it must install from its wheel and pass its
  # suite on the standard library alone, without its optional accelerator.
  docstruct-isolated:
    name: docstruct alone (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install docstruct alone
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./libs/docstruct[dev]" --no-cache-dir

      - name: Check that no other project package or accelerator is importable
        working-directory: libs/docstruct
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          import docstruct

          present = [
              name
              for name in (
                  "backend", "acessilia_sdk", "acessilia_toolbox", "agno",
                  "fastapi", "pydantic", "httpx", "rapidfuzz",
              )
              if importlib.util.find_spec(name) is not None
          ]
          if present:
              raise SystemExit(f"importable next to docstruct: {present}")
          # The suite must test the installed wheel, not the source tree.
          location = Path(docstruct.__file__).resolve()
          if "site-packages" not in location.parts:
              raise SystemExit(f"docstruct imported from {location}, not from the wheel")
          print(f"docstruct is installed alone: {location.parent}")
          PY

      - name: Run the docstruct test suite
        working-directory: libs/docstruct
        run: python -m pytest -rs --junitxml=docstruct-isolated-results.xml

      - name: Reject unexpected skipped tests
        working-directory: libs/docstruct
        run: |
          python - <<'PY'
          from xml.etree import ElementTree

          root = ElementTree.parse("docstruct-isolated-results.xml").getroot()
          skipped = sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"{skipped} docstruct test(s) skipped on the standard library alone.")
          print("No docstruct test was skipped.")
          PY

      - name: Upload docstruct isolation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docstruct-isolated-report
          path: libs/docstruct/docstruct-isolated-results.xml
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Restore dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install "./libs/sdk[dev]" --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir

      # The SDK registry must match the contract the Toolbox publishes on the
      # branch this code is deployed with (#186): main runs against the
      # Toolbox's main, release/x.y.z against the Toolbox's release/x.y.z
      # while its BHS is open and its vx.y.z tag once the Toolbox closed the
      # cycle (both are cut together, the Toolbox first), and everything else
      # against its develop. See scripts/toolbox_contract_ref.py.
      - name: Check the Toolbox capability contract
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          # Fails (bash -e) when a release has neither ref: no fallback.
          TOOLBOX_REF=$(python scripts/toolbox_contract_ref.py "$TARGET_BRANCH")
          # Same URL as PUBLISHED_URL in scripts/capture_toolbox_contract.py.
          # curl stays here for --retry, which the script's urllib fetch lacks.
          url="https://raw.githubusercontent.com/A11yDevs/acessilia-toolbox/${TOOLBOX_REF}/contract/toolbox-contract.json"
          echo "Toolbox contract: $url"
          if ! curl --fail --silent --show-error --location --retry 3 \
              --output "$RUNNER_TEMP/toolbox-contract.json" "$url"; then
            echo "::error::Failed to download the Toolbox contract from ${TOOLBOX_REF} (missing file or network error; see the curl output above)."
            exit 1
          fi
          python scripts/check_capability_contract.py --snapshot "$RUNNER_TEMP/toolbox-contract.json"

      # The Toolbox pins a docstruct release by URL and sha256 (#470, P8). Only
      # the Toolbox can move that pin, so a pull request is not blocked by it:
      # findings are warnings here, and the scheduled monitoring fails on them.
      - name: Report the Toolbox's docstruct pin
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python scripts/check_docstruct_pin.py "$TARGET_BRANCH" --report-only

      # Four workers match the ubuntu-latest four-vCPU runner and keep the
      # slowest test from dominating the tail. The run also collects the suite,
      # so the old standalone `--collect-only` step is redundant.
      - name: Run complete test suite
        run: python -m pytest -m "not e2e" -n 4 --dist worksteal --durations=25 --junitxml=test-results.xml

      - name: Run docstruct library test suite
        working-directory: libs/docstruct
        run: python -m pytest --durations=25 --junitxml=docstruct-test-results.xml

      - name: Run SDK library test suite
        working-directory: libs/sdk
        run: python -m pytest --durations=25 --junitxml=sdk-test-results.xml

      - name: Reject unexpected skipped tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = [
              Path("test-results.xml"),
              Path("libs/docstruct/docstruct-test-results.xml"),
              Path("libs/sdk/sdk-test-results.xml"),
          ]
          skipped = 0
          for report in reports:
              root = ElementTree.parse(report).getroot()
              skipped += sum(
                  int(suite.attrib.get("skipped", "0"))
                  for suite in root.iter("testsuite")
              )
          if skipped:
              raise SystemExit(
                  f"CI incompleto: {skipped} teste(s) foram pulado(s). "
                  "Consulte os motivos exibidos pelo pytest."
              )
          print("Relatorio JUnit validado: nenhum teste foi pulado.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            test-results.xml
            libs/docstruct/docstruct-test-results.xml
            libs/sdk/sdk-test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  delivery:
    name: publish verified images
    if: >
      github.event_name == 'push' &&
      (
        github.ref_name == 'main' ||
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'release/')
      )
    needs:
      - tests
      - sdk-isolated
      - docstruct-isolated
    uses: ./.github/workflows/delivery.yml
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets: inherit
