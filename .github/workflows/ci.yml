name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Restore dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ffmpeg \
            fonts-dejavu-core \
            libgl1 \
            libglib2.0-0 \
            libmagic1 \
            pandoc \
            poppler-utils \
            texlive-xetex

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./libs/docstruct --no-cache-dir
          python -m pip install ".[dev]" --no-cache-dir

      - name: Collect complete test suite
        run: python -m pytest --collect-only -q -m "not e2e"

      - name: Run complete test suite
        run: python -m pytest -m "not e2e" --junitxml=test-results.xml

      - name: Reject unexpected skipped tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("test-results.xml")
          root = ElementTree.parse(report).getroot()
          skipped = sum(
              int(suite.attrib.get("skipped", "0"))
              for suite in root.iter("testsuite")
          )
          if skipped:
              raise SystemExit(
                  f"CI incompleto: {skipped} teste(s) foram pulado(s). "
                  "Consulte os motivos exibidos pelo pytest."
              )
          print("Relatorio JUnit validado: nenhum teste foi pulado.")
          PY

  delivery:
    name: publish verified images
    if: >
      github.event_name == 'push' &&
      (
        github.ref_name == 'main' ||
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'release/')
      )
    needs:
      - tests
    uses: ./.github/workflows/delivery.yml
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets: inherit
