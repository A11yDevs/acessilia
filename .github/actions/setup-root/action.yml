name: Set up root environment
description: Set up Python and uv, restore the lock cache and install the root dev environment.
inputs:
  python-version:
    description: Python version for the job
    required: false
    default: "3.12"
  lock-hash:
    description: Hash of uv.lock (pass hashFiles('uv.lock') from the caller)
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.11.17"

    - name: Restore uv cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ inputs.lock-hash }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Check the lock and install from it
      shell: bash
      run: |
        uv lock --check
        uv sync --locked --extra dev
