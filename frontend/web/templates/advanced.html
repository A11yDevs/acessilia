<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ advanced_title }}</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: #6f42c1;
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
            text-align: center;
        }
        .btn-primary {
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9em;
            color: #6c757d;
        }
        :focus {
            outline: 3px solid #ffc107 !important;
            outline-offset: 2px;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <div class="card">
            <header class="card-header">
                <div class="text-start mb-2">
                    <img src="/static/logo.png"
                         alt="{{ logo_alt }}"
                         style="max-width: 180px; height: auto;">
                </div>
                <h1 class="h3 mb-0">{{ advanced_headline }}</h1>
                <p class="mb-0 mt-1 small">{{ advanced_subhead }}</p>
            </header>
            <div class="card-body p-4">
                <p class="mb-4">{{ advanced_intro }}</p>

                {% if message %}
                <div class="alert alert-success" role="alert">
                    {{ message }}
                </div>
                {% endif %}

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form action="/advanced/process" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="email" class="form-label">{{ index_email_label }}</label>
                        <input type="email" class="form-control" id="email" name="email" required
                               placeholder="exemplo@email.com" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">{{ index_email_help }}</div>
                    </div>

                    <div class="mb-3">
                        <label for="document_file" class="form-label">{{ index_doc_label }}</label>
                        <input type="file" class="form-control" id="document_file" name="document_file" required
                               accept="application/pdf,.pdf,image/*">
                    </div>

                    <div class="mb-3">
                        <label for="custom_prompt" class="form-label">{{ advanced_prompt_label }}</label>
                        <textarea class="form-control" id="custom_prompt" name="custom_prompt"
                                  rows="6" maxlength="6000"
                                  placeholder="{{ advanced_prompt_placeholder }}"
                                  aria-describedby="promptHelp"></textarea>
                        <div id="promptHelp" class="form-text">
                            {{ advanced_prompt_help }}
                        </div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="thinking_mode" name="thinking_mode" value="true">
                        <label class="form-check-label" for="thinking_mode">
                            {{ advanced_thinking_label }}
                        </label>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">{{ index_submit }}</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="/" class="btn btn-outline-secondary btn-sm">{{ advanced_back_link }}</a>
                </div>
            </div>
        </div>
        <footer class="footer">
            <p>&copy; 2026 Acessilia - {{ footer }}</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
