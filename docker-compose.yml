services:
  acessilia:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: base
      args:
        WITH_DOCLING: "true"
    image: acessilia:latest
    container_name: acessilia-instance
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./var:/app/var
    env_file:
      - .env
    environment:
      # Dentro do container, host.docker.internal alcança serviços no host.
      # Descomente se a Toolbox estiver rodando no host na porta 8002:
      # TOOLBOX_BASE_URL=http://host.docker.internal:8002
      TOOLBOX_BASE_URL=${TOOLBOX_BASE_URL:-http://host.docker.internal:8002}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if echo \"$ENABLED_INTERFACES\" | grep -q 'api'; then curl -fsS http://localhost:8000/api/v1/health; else curl -fsS http://localhost:8001/; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
