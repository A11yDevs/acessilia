services:
  acessilia:
    # TRACK_TAG e definido pelo production-update.sh. Use main por padrao.
    image: ghcr.io/a11ydevs/acessilia:${TRACK_TAG:-main}
    container_name: acessilia-production
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./var:/app/var
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if echo \"$ENABLED_INTERFACES\" | grep -q 'api'; then curl -fsS http://localhost:8000/api/v1/health; else curl -fsS http://localhost:8001/; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s